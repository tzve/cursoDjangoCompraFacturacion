# Redirige HTTP a HTTPS
server {
    listen 80;
    server_name reformaselbosque.com www.reformaselbosque.com;
    return 301 https://$host$request_uri;
}

# Bloque HTTPS
server {
    listen 8443 ssl;
    server_name reformaselbosque.com www.reformaselbosque.com;

    ssl_certificate /etc/synology-certs/fullchain.pem;
    ssl_certificate_key /etc/synology-certs/privkey.pem;

    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Archivos estáticos con cache largo
    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "public, immutable";
        access_log off;
        expires 1y;
        
        # Manejar query strings para archivos con hash
        location ~* \.(woff|woff2|ttf|otf|eot)(\?.*)?$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # Archivos media con cache
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Proxy a Django
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}